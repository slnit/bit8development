            color: #f1f5f9;

        #tech-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            z-index: 0;
            opacity: 0.45;

            position: relative;
            overflow: hidden;
        }
        .cyber-card::before {
            content: '';

            top: 0;

            height: 100%;

            transition: 0.6s;

        .cyber-card:hover::before {

        }
